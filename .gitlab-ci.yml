image: docker:latest  # Use the latest Docker image

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: "$CI_REGISTRY/wickedflame/avalanche-web:$CI_COMMIT_SHA"

services:
  - docker:dind

stages:
  - build
  - deploy

before_script:
  - echo $CI_BUILD_TOKEN | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -f dockerfile.web --pull -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
  only:
    - main
    - dev
    - merge_requests

