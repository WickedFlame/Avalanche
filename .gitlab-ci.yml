# image: docker:latest  # Use the latest Docker image
image: mcr.microsoft.com/dotnet/sdk:8.0

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: "$CI_REGISTRY/wickedflame/avalanche-web:$CI_COMMIT_SHA"
  VERSION: 0.0.1

services:
  - docker:dind

stages:
  - build
  - deploy

before_script:
#  - docker login "${CI_REGISTRY:?}" -u "${CI_REGISTRY_USER:?}" -p "${CI_JOB_TOKEN:?}"
  - dotnet tool install Nuke.GlobalTool --global
  - export PATH="$PATH:/root/.dotnet/tools"
  # - docker login -u "{$CI_REGISTRY_USER:?}" -p "${CI_REGISTRY_PASSWORD:?}" "${CI_REGISTRY:?}"

#  - echo "${CI_BUILD_TOKEN:?}" | docker login -u "{$CI_REGISTRY_USER:?}" --password-stdin "${CI_REGISTRY:?}"
#  - echo "${REGISTRY_PASSWORD:?}" | docker login --password-stdin -u "${REGISTRY_USER:?}" -- "${CI_REGISTRY:?}"

build_solution:
  stage: build
  script:
  - dotnet restore
  - dotnet restore ./build/_build.csproj
  - nuke deploy -version $VERSION

build_image:
  before_script:
    - docker login "${CI_REGISTRY:?}" -u "${CI_REGISTRY_USER:?}" -p "${CI_JOB_TOKEN:?}"
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
#    - docker build -f dockerfile-web --pull -t "$IMAGE_TAG" .
    - cp -r ./src/!Build/web/ docker-context/
    - docker build -f dockerfile-web docker-context/ -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
  only:
    - main
    - dev
    - merge_requests

