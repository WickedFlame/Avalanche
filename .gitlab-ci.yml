# image: docker:latest  # Use the latest Docker image
image: mcr.microsoft.com/dotnet/sdk:8.0

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: "$CI_REGISTRY/wickedflame/avalanche/avalanche-web:$CI_COMMIT_SHA"
  VERSION: 0.0.1

services:
  - docker:dind

stages:
  - build
  - buildimage
  - deploy
  
build_solution:
  stage: build
  before_script:
    - dotnet tool install Nuke.GlobalTool --global
    - export PATH="$PATH:/root/.dotnet/tools"
  script:
  - dotnet restore
  - dotnet restore ./build/_build.csproj
  - nuke deploy -version $VERSION
  - ls -la
  artifacts:
    paths:
      - artifacts/**/*.*
      - artifacts/**/*.*

build_web_image:
  stage: buildimage
  image: docker:latest
  services:
    - docker:dind
  script:
    - ls -la
    - docker build -f dockerfile-web -t "$IMAGE_TAG" .
  only:
    - main
    - dev
    - merge_requests


deploy_web_image:
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  #   - docker login "${CI_REGISTRY:?}" -u "${CI_REGISTRY_USER:?}" -p "${CI_JOB_TOKEN:?}"
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
#    - docker build -f dockerfile-web --pull -t "$IMAGE_TAG" .
    - ls -la
# https://forum.gitlab.com/t/copying-previous-job-artifacts-into-a-dockerfile/122159/2 
#    - cp -r artifacts/web/ docker-context/
#    - docker build -f dockerfile-web docker-context/ -t "$IMAGE_TAG" .
#    - docker build -f dockerfile-web -t "$IMAGE_TAG" .
#    - docker push "$IMAGE_TAG"
    - docker tag $IMAGE_TAG $CI_REGISTRY/wickedflame/avalanche/avalanche-web:latest
    - docker tag $IMAGE_TAG $CI_REGISTRY/wickedflame/avalanche/avalanche-web:$VERSION
    - docker push $CI_REGISTRY/wickedflame/avalanche/avalanche-web:latest
    - docker push $CI_REGISTRY/wickedflame/avalanche/avalanche-web:$VERSION
  only:
    - main
    - dev
    - merge_requests

